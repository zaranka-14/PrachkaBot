[project]
name = "prachkabot"
version = "0.1.0"
description = "Bot for ChistUla prachka"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.30.0",
    "dotenv>=0.9.9",
    "google>=3.0.0",
    "gspread>=6.2.1",
    "hatchling>=1.31.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
prachka-bot = "prachka_bot.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prachka_bot"]
